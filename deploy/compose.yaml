services:
  releases:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${RELEASE_HOST:?Set a separate release hostname}
    volumes:
      - release_data:/data
    secrets:
      - owner_key
    expose:
      - "8788"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RELEASE_HOST: ${RELEASE_HOST:?Set a separate release hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - releases
secrets:
  owner_key:
    file: ${OWNER_KEY_PATH:?Set the private owner-key file path}
volumes:
  release_data:
  caddy_data:
  caddy_config:
